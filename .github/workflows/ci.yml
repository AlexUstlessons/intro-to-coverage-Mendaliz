name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E402

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bank:bank@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        id: run_tests
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=json -q 2>&1 | tee coverage_output.txt
          exit ${PIPESTATUS[0]}

      - name: Parse coverage percentage
        if: always()
        id: coverage
        run: |
          if [ -f coverage.json ]; then
            PCT=$(python3 -c "import json; d=json.load(open('coverage.json')); print(int(d['totals']['percent_covered']))")
          else
            PCT=0
          fi
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Write coverage summary
        if: always()
        run: |
          PCT="${{ steps.coverage.outputs.pct }}"
          {
            if [ "$PCT" = "100" ]; then
              echo "## ✅ Coverage: 100% — All tests written. Assignment complete!"
              echo ""
              echo "> Great work! Every line of code is covered."
            else
              echo "## ❌ Coverage: ${PCT}% — Need 100%"
              echo ""
              echo "> Check the report below to find uncovered lines and write the missing tests."
            fi
            echo ""
            echo "### Coverage report"
            echo '```'
            cat coverage_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: intro-to-coverage:latest
